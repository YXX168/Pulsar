name: Release Android

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: pulsar-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate tag version
        shell: bash
        run: |
          version="$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${version}."
            exit 1
          fi

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required signing secret ${value} is missing."
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/release.jks
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Package release files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Pulsar-v${version}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Pulsar-v${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Pulsar-v${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/Pulsar-v${version}-x86_64.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "Pulsar ${GITHUB_REF_NAME#v}"
          --notes-from-tag

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
