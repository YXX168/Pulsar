name: 功能请求
description: 为情绪星海提议一个新功能或改进
title: "[功能请求]: "
labels: ["enhancement", "待讨论"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能请求！请尽量清晰地描述您的想法，以便我们评估和讨论。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 您的新功能是为了解决什么问题？
      placeholder: 当我想要……时，总是觉得不方便……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 请描述您希望实现的功能。
      placeholder: 我希望应用能够……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 您是否考虑过其它替代方案？
      placeholder: 也可以用这种方式实现……

  - type: dropdown
    id: category
    attributes:
      label: 功能分类
      options:
        - 情绪记录
        - 星系可视化
        - 历史日历
        - 统计分析
        - 本地存储
        - 备份恢复
        - 界面与交互
        - 其它
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 低
        - 中
        - 高
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 如有设计草图、参考链接或其它上下文，请在此添加。
      placeholder: 其它有助于理解的信息……

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有 Issue，确认没有重复提交。
          required: true
        - label: 我理解功能请求可能需要社区讨论后才会被采纳。
          required: true
